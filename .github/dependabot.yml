# Actions are pinned to commit SHAs, which is what makes a moved tag harmless.
# The cost of pinning is that a SHA never updates on its own, so Dependabot
# raises a PR when the upstream action releases a new version.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
